name: daily
on:
  schedule:
    - cron: "17 10 * * *"
    - cron: "47 13 * * *"
    - cron: "29 17 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: daily
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - id: check
        if: github.event_name == 'schedule'
        run: |
          f="docs/data/$(TZ=America/New_York date +%F).json"
          if [ -f "$f" ] && ! grep -q '"stale": true' "$f"; then echo "done=1" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.done != '1'
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
          .venv/bin/python -m playwright install --with-deps chromium
      - id: run
        if: steps.check.outputs.done != '1'
        continue-on-error: true
        run: .venv/bin/python top10.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
      - if: steps.check.outputs.done != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs state
          git diff --cached --quiet || git commit -q -m "$(date -u +%F)"
          git push
      - if: steps.run.outcome == 'failure'
        run: exit 1
